<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkir</title>
</head>
<body>
    <h1>Hrga parkir STT NF</h1>
    <label for="in">jam masuk:</label>
    <input type="number" id="in">
    <br>
    <label for="out">jam keluar: </label>
    <input type="number" id="out">
    <br>
    <span id="durasi"></span>
    <br>
    <button type="button" onclick="hitungParkir()">hitung</button>

    <script>
        function hitungParkir(){
            let masuk = parseFloat(document.getElementById("in").value) || 0;
            let keluar = parseFloat(document.getElementById("out").value) || 0;
            let durasi = keluar - masuk;

            let tarif_awal = 3000;
            let selisih_waktu = Math.round(durasi-2);
            let tarif_lanjut =  selisih_waktu * 1000;
            let total = tarif_awal + tarif_lanjut;
            document.getElementById("durasi").innerHTML = "Durasi parkir: " + durasi + " jam <br> Total tarif parkir: Rp. " + total.toLocaleString();
            

        }
    </script>
    
</body>
</html>

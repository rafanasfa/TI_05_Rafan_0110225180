<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurs Rupiah</title>
</head>
<body>
    <h2>Dolar to Rupiah</h2>
    <h4>Nilai kurs Rupiah = Rp. 16.000</h4>
    <label for="dollar">Dolar</label>
    <input type="number" id="dolar">
    <br>
    <span id="hasil"></span>
    <button type="button" onclick="hitungDolarKeRupiah()">Hitung</button>

    <hr>
    <br>

    <h2>Rupiah to dolar</h2>
    <label for="rupiah">Rupiah</label>
    <input type="number" id="rupiah">
    <br>
    <span id="hasil2"></span>
    <button type="button" onclick="hitungRupiahKeDolar()">Hitung</button>
    
    <script>
        function hitungDolarKeRupiah(){
            let rp = 16000;
            let d = parseFloat(document.getElementById("dolar").value) || 0;
            let h = d * rp;
            document.getElementById("hasil").innerHTML = "Hasil = Rp.  " +h.toLocaleString();
        }

        function hitungRupiahKeDolar(){
             let rate = 16000;
            let rp2= parseFloat(document.getElementById("rupiah").value) || 0;
            let h = rp2 / rate;
            document.getElementById("hasil2").innerHTML = "Dolar  = $  " +h.toFixed(2);
        }
       
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Hitung Lingkaran</title>
</head>
<body>
    <h2>Hitung Luas dan Keliling Lingkaran</h2>

    <label>Masukkan jari-jari:</label>
    <input type="number" id="radius" placeholder="masukan angka">
    <br>

    <button onclick="hitung()">Hitung</button>

    <p id="hasilLuas"></p>
    <p id="hasilKeliling"></p>

    <script>
        function hitung() {
            let r = document.getElementById("radius").value;
            let luas = 3.14 * r * r;
            let keliling = 2 * 3.14 * r;

            document.getElementById("hasilLuas").innerHTML = "Luas: " + luas;
            document.getElementById("hasilKeliling").innerHTML = "Keliling: " + keliling;
        }
    </script>
</body>
</html>
